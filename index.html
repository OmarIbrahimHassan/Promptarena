document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <script type="__bundler/template">
"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"15b323bb-0fc5-4728-9b5e-58277a9ec993\"><\u002Fscript>\n<\u002Fhead>\n<body>\n\n\n<x-dc>\n<helmet>\n<style>\n  html, body { margin:0; padding:0; background:#F4F4F4; }\n  body { font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing:antialiased; }\n  * { box-sizing:border-box; }\n  a { color:#E60000; text-decoration:none; }\n  a:hover { color:#E6007E; }\n  ::-webkit-scrollbar { width:10px; height:10px; }\n  ::-webkit-scrollbar-thumb { background:#D4D4D4; border-radius:0; }\n  ::-webkit-scrollbar-track { background:#EFEFEF; }\n<\u002Fstyle>\n<\u002Fhelmet>\n<div style=\"display:flex; flex-direction:column; height:100vh; min-width:1024px; overflow:hidden; background:#F4F4F4; color:#25282B;\">\n\n  <div style=\"display:flex; align-items:center; gap:24px; height:56px; flex:0 0 56px; background:#000000; padding:0 20px; position:relative; z-index:60;\">\n    <div style=\"display:flex; align-items:center; gap:14px; flex:0 0 auto;\">\n      <div style=\"color:#FFFFFF; font-size:19px; font-weight:700; letter-spacing:0.06em;\">{{ orgName }}<\u002Fdiv>\n      <div style=\"width:1px; height:22px; background:#3A3A3A;\"><\u002Fdiv>\n      <div style=\"color:#C8C8C8; font-size:10px; letter-spacing:0.2em; font-weight:400;\">BUSINESS RISK MANAGEMENT<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"position:relative; flex:1 1 auto; max-width:460px;\">\n      <input value=\"{{ q }}\" sc-camel-on-change=\"{{ onSearch }}\" sc-camel-on-focus=\"{{ openSearch }}\" placeholder=\"Search risks, controls, KRIs, actions, initiatives\" style=\"width:100%; height:34px; background:#1C1C1C; border:1px solid #333333; color:#FFFFFF; font-size:12.5px; padding:0 12px 0 32px; font-family:inherit; outline:none;\">\n      <svg sc-camel-view-box=\"0 0 24 24\" width=\"14\" height=\"14\" fill=\"none\" stroke=\"#8A8A8A\" stroke-width=\"1.6\" style=\"position:absolute; left:10px; top:10px;\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"M20 20l-3.5-3.5\"><\u002Fpath><\u002Fsvg>\n      <sc-if value=\"{{ searchOpen }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"position:absolute; top:38px; left:0; right:0; background:#FFFFFF; border:1px solid #DCDCDC; box-shadow:0 12px 30px rgba(0,0,0,0.18); max-height:340px; overflow:auto;\">\n          <sc-for list=\"{{ searchResults }}\" as=\"r\" hint-placeholder-count=\"3\">\n            <div sc-camel-on-click=\"{{ r.go }}\" style=\"display:flex; align-items:center; gap:10px; padding:9px 12px; border-bottom:1px solid #F0F0F0; cursor:pointer;\" style-hover=\"background:#FAF0F0;\">\n              <div style=\"font-size:9px; letter-spacing:0.12em; color:#FFFFFF; background:#9C2AA0; padding:2px 5px; flex:0 0 auto;\">{{ r.kind }}<\u002Fdiv>\n              <div style=\"font-size:11px; color:#8A8A8A; font-family:ui-monospace, Menlo, monospace; flex:0 0 auto;\">{{ r.id }}<\u002Fdiv>\n              <div style=\"font-size:12.5px; color:#25282B; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;\">{{ r.title }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ noSearchResults }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:16px; font-size:12.5px; color:#6A6A6A;\">No matches. Try a risk ID, owner name or keyword.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"display:flex; align-items:center; gap:10px; margin-left:auto; flex:0 0 auto;\">\n      <div style=\"position:relative;\">\n        <div sc-camel-on-click=\"{{ toggleCreate }}\" style=\"display:flex; align-items:center; gap:7px; height:32px; padding:0 14px; background:#E60000; color:#FFFFFF; font-size:11px; letter-spacing:0.12em; cursor:pointer; user-select:none;\" style-hover=\"background:#C50000;\">\n          <span style=\"font-size:15px; line-height:1;\">+<\u002Fspan><span>CREATE<\u002Fspan>\n        <\u002Fdiv>\n        <sc-if value=\"{{ createOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:absolute; top:36px; right:0; width:230px; background:#FFFFFF; border:1px solid #DCDCDC; box-shadow:0 12px 30px rgba(0,0,0,0.18);\">\n            <sc-for list=\"{{ createItems }}\" as=\"c\" hint-placeholder-count=\"4\">\n              <div sc-camel-on-click=\"{{ c.go }}\" style=\"padding:10px 14px; font-size:12.5px; border-bottom:1px solid #F0F0F0; cursor:pointer;\" style-hover=\"background:#FAF0F0; color:#E60000;\">{{ c.label }}<\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"position:relative;\">\n        <div sc-camel-on-click=\"{{ toggleNotif }}\" style=\"position:relative; width:32px; height:32px; display:flex; align-items:center; justify-content:center; cursor:pointer; border:1px solid #333333;\">\n          <svg sc-camel-view-box=\"0 0 24 24\" width=\"15\" height=\"15\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.4\"><path d=\"M18 16V11a6 6 0 10-12 0v5l-2 3h16zM10 22h4\"><\u002Fpath><\u002Fsvg>\n          <div style=\"position:absolute; top:-6px; right:-6px; min-width:16px; height:16px; background:#E60000; color:#FFFFFF; font-size:9.5px; display:flex; align-items:center; justify-content:center; padding:0 4px;\">{{ unreadCount }}<\u002Fdiv>\n        <\u002Fdiv>\n        <sc-if value=\"{{ notifOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:absolute; top:36px; right:0; width:380px; background:#FFFFFF; border:1px solid #DCDCDC; box-shadow:0 12px 30px rgba(0,0,0,0.18);\">\n            <div style=\"padding:10px 14px; font-size:10px; letter-spacing:0.16em; color:#6A6A6A; border-bottom:1px solid #EBEBEB;\">NOTIFICATIONS<\u002Fdiv>\n            <sc-for list=\"{{ notifications }}\" as=\"n\" hint-placeholder-count=\"4\">\n              <div sc-camel-on-click=\"{{ n.go }}\" style=\"display:flex; gap:10px; padding:11px 14px; border-bottom:1px solid #F4F4F4; cursor:pointer;\" style-hover=\"background:#FAFAFA;\">\n                <div style=\"width:6px; height:6px; border-radius:50%; margin-top:6px; flex:0 0 auto; background:#E60000;\"><\u002Fdiv>\n                <div>\n                  <div style=\"font-size:12.5px; color:#25282B; line-height:1.45;\">{{ n.text }}<\u002Fdiv>\n                  <div style=\"font-size:10.5px; color:#8A8A8A; margin-top:3px;\">{{ n.when }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n\n      <div style=\"position:relative;\">\n        <div sc-camel-on-click=\"{{ toggleRole }}\" style=\"display:flex; align-items:center; gap:10px; height:32px; padding:0 12px; border:1px solid #333333; cursor:pointer;\">\n          <div style=\"width:20px; height:20px; background:#9C2AA0; color:#FFFFFF; font-size:9.5px; display:flex; align-items:center; justify-content:center;\">{{ userInitials }}<\u002Fdiv>\n          <div>\n            <div style=\"color:#8A8A8A; font-size:8.5px; letter-spacing:0.14em;\">VIEWING AS<\u002Fdiv>\n            <div style=\"color:#FFFFFF; font-size:11px;\">{{ role }}<\u002Fdiv>\n          <\u002Fdiv>\n          <svg sc-camel-view-box=\"0 0 24 24\" width=\"12\" height=\"12\" fill=\"none\" stroke=\"#8A8A8A\" stroke-width=\"1.8\"><path d=\"M6 9l6 6 6-6\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <sc-if value=\"{{ roleOpen }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"position:absolute; top:36px; right:0; width:300px; background:#FFFFFF; border:1px solid #DCDCDC; box-shadow:0 12px 30px rgba(0,0,0,0.18);\">\n            <div style=\"padding:10px 14px; font-size:10px; letter-spacing:0.16em; color:#6A6A6A; border-bottom:1px solid #EBEBEB;\">DEMO PERSONA<\u002Fdiv>\n            <sc-for list=\"{{ roles }}\" as=\"r\" hint-placeholder-count=\"7\">\n              <div sc-camel-on-click=\"{{ r.pick }}\" style=\"display:flex; justify-content:space-between; align-items:center; padding:10px 14px; font-size:12.5px; border-bottom:1px solid #F4F4F4; cursor:pointer;\" style-hover=\"background:#FAF0F0;\">\n                <div>\n                  <div style=\"color:#25282B;\">{{ r.name }}<\u002Fdiv>\n                  <div style=\"color:#8A8A8A; font-size:10.5px; margin-top:2px;\">{{ r.scope }}<\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:11px; color:#E60000;\">{{ r.mark }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex; flex:1 1 auto; min-height:0;\">\n\n    <div style=\"flex:0 0 auto; background:#FFFFFF; border-right:1px solid #E4E4E4; overflow-y:auto; overflow-x:hidden; display:flex; flex-direction:column;\" style-hover=\"\">\n      <div style=\"width:{{ navWidth }}; transition:width 0.15s;\">\n        <sc-for list=\"{{ navGroups }}\" as=\"g\" hint-placeholder-count=\"5\">\n          <div style=\"padding:14px 0 4px 0;\">\n            <div style=\"padding:0 18px 6px 18px; font-size:9px; letter-spacing:0.18em; color:#9A9A9A;\">{{ g.label }}<\u002Fdiv>\n            <sc-for list=\"{{ g.items }}\" as=\"it\" hint-placeholder-count=\"3\">\n              <div sc-camel-on-click=\"{{ it.go }}\" style=\"{{ it.style }}\" style-hover=\"background:#F6F6F6;\">\n                <svg sc-camel-view-box=\"0 0 24 24\" width=\"15\" height=\"15\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.35\" style=\"flex:0 0 auto;\"><path d=\"{{ it.icon }}\"><\u002Fpath><\u002Fsvg>\n                <div style=\"flex:1 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;\">{{ it.label }}<\u002Fdiv>\n                <div style=\"font-size:10px; color:#9A9A9A;\">{{ it.badge }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n        <div sc-camel-on-click=\"{{ toggleNav }}\" style=\"margin:10px 18px 24px 18px; padding-top:12px; border-top:1px solid #EBEBEB; font-size:10px; letter-spacing:0.14em; color:#8A8A8A; cursor:pointer;\">{{ navToggleLabel }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"flex:1 1 auto; min-width:0; overflow:auto; background:#F4F4F4;\">\n\n      <div style=\"background:#FFFFFF; border-bottom:1px solid #E4E4E4; padding:18px 28px 0 28px;\">\n        <div style=\"display:flex; align-items:center; gap:8px; font-size:10.5px; color:#8A8A8A;\">\n          <sc-for list=\"{{ crumbs }}\" as=\"c\" hint-placeholder-count=\"2\">\n            <div sc-camel-on-click=\"{{ c.go }}\" style=\"cursor:pointer;\" style-hover=\"color:#E60000;\">{{ c.label }}<\u002Fdiv>\n            <div style=\"color:#CFCFCF;\">/<\u002Fdiv>\n          <\u002Fsc-for>\n          <div style=\"color:#25282B;\">{{ pageTitle }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; align-items:flex-end; justify-content:space-between; gap:24px; padding:10px 0 16px 0;\">\n          <div>\n            <div style=\"font-size:22px; letter-spacing:0.15em; font-weight:400; text-transform:uppercase; color:#25282B;\">{{ pageTitle }}<\u002Fdiv>\n            <div style=\"font-size:12.5px; color:#6A6A6A; margin-top:6px; max-width:820px; line-height:1.5;\">{{ pageSubtitle }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; align-items:center; gap:10px; flex:0 0 auto; padding-bottom:2px;\">\n            <div style=\"font-size:10.5px; color:#8A8A8A;\">Data as of {{ dataAsOf }}<\u002Fdiv>\n            <div style=\"display:flex; align-items:center; gap:8px; border:1px solid #E4E4E4; padding:5px 10px;\">\n              <div style=\"width:7px; height:7px; background:#E6007E;\"><\u002Fdiv>\n              <div style=\"font-size:10.5px; color:#4A4D4E;\">{{ viewingAs }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:22px 28px 60px 28px;\">\n\n        <sc-if value=\"{{ isWorkspace }}\" hint-placeholder-val=\"{{ true }}\">\n          <div>\n            <div style=\"display:flex; gap:0; background:linear-gradient(100deg,#2B0A0E 0%,#6B0F16 52%,#1A1A1A 100%); padding:22px 26px; margin-bottom:18px; align-items:center; justify-content:space-between; position:relative; overflow:hidden;\">\n              <div style=\"position:relative; z-index:2;\">\n                <div style=\"font-size:10px; letter-spacing:0.2em; color:#F0A6A6;\">{{ greetingLabel }}<\u002Fdiv>\n                <div style=\"font-size:23px; letter-spacing:0.1em; color:#FFFFFF; margin-top:8px; text-transform:uppercase; font-weight:300;\">{{ userName }}<\u002Fdiv>\n                <div style=\"font-size:12.5px; color:#D8C7C7; margin-top:8px;\">{{ workspaceLine }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"position:relative; z-index:2; display:flex; gap:10px;\">\n                <div sc-camel-on-click=\"{{ goApprovals }}\" style=\"padding:9px 16px; background:#E60000; color:#FFFFFF; font-size:11px; letter-spacing:0.12em; cursor:pointer;\" style-hover=\"background:#FFFFFF; color:#E60000;\">OPEN MY QUEUE<\u002Fdiv>\n                <div sc-camel-on-click=\"{{ goProfile }}\" style=\"padding:9px 16px; border:1px solid #FFFFFF; color:#FFFFFF; font-size:11px; letter-spacing:0.12em; cursor:pointer;\" style-hover=\"background:#FFFFFF; color:#25282B;\">ENTERPRISE PROFILE<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"position:absolute; right:-40px; top:-30px; width:260px; height:200px; border:2px solid #E6007E; z-index:1; opacity:0.5;\"><\u002Fdiv>\n              <div style=\"position:absolute; left:44%; top:0; bottom:0; width:200px; background-image:radial-gradient(#E6007E 1.1px, transparent 1.1px); background-size:9px 9px; opacity:0.22; z-index:0;\"><\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"display:grid; grid-template-columns:repeat(6, minmax(0,1fr)); gap:12px; margin-bottom:18px;\">\n              <sc-for list=\"{{ wsKpis }}\" as=\"k\" hint-placeholder-count=\"6\">\n                <div sc-camel-on-click=\"{{ k.go }}\" style=\"background:#FFFFFF; border:1px solid #E4E4E4; padding:14px 15px; cursor:pointer;\" style-hover=\"border-color:#E60000;\">\n                  <div style=\"font-size:9.5px; letter-spacing:0.13em; color:#8A8A8A; min-height:26px; line-height:1.35;\">{{ k.label }}<\u002Fdiv>\n                  <div style=\"display:flex; align-items:baseline; gap:8px; margin-top:8px;\">\n                    <div style=\"font-size:28px; font-weight:300; color:#25282B;\">{{ k.value }}<\u002Fdiv>\n                    <div style=\"font-size:11px; color:{{ k.deltaColor }};\">{{ k.delta }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n\n            <div style=\"display:grid; grid-template-columns:minmax(0,1.55fr) minmax(0,1fr); gap:16px; align-items:start;\">\n\n              <div style=\"display:flex; flex-direction:column; gap:16px;\">\n                <div style=\"background:#FFFFFF; border:1px solid #E4E4E4;\">\n                  <div style=\"display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-bottom:1px solid #EBEBEB;\">\n                    <div style=\"font-size:11px; letter-spacing:0.16em; color:#25282B;\">MY OPEN TASKS<\u002Fdiv>\n                    <div style=\"display:flex; gap:6px;\">\n                      <sc-for list=\"{{ taskTabs }}\" as=\"t\" hint-placeholder-count=\"3\">\n                        <div sc-camel-on-click=\"{{ t.go }}\" style=\"{{ t.style }}\">{{ t.label }}<\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"display:grid; grid-template-columns:92px minmax(0,1fr) 150px 110px 92px; padding:8px 16px; background:#FAFAFA; border-bottom:1px solid #EBE .5px; color:#6A6A6A; margin-bottom:5px;\">There is a risk that (uncertain event)<\u002Fdiv>\n                        <input value=\"{{ wizEvent }}\" sc-camel-on-change=\"{{ onEvent }}\" placeholder=\"e.g. an attacker gains access to customer data\" style=\"width:100%; font-size:13px; padding:10px 12px; border:1px solid #E0E0E0; font-family:inherit; outline:none;\">\n                      <\u002Fdiv>\n                      <div>\n                        <div style=\"font-size:11.5px; color:#6A6A6A; margin-bottom:5px;\">Resulting in (consequence or impact)<\u002Fdiv>\n                        <input value=\"{{ wizConseq }}\" sc-camel-on-change=\"{{ onConseq }}\" placeholder=\"e.g. regulatory penalty and loss of customer trust\" style=\"width:100%; font-size:13px; padding:10px 12px; border:1px solid #E0E0E0; font-family:inherit; outline:none;\">\n                      <\u002Fdiv>\n                      <div>\n                        <div style=\"font-size:11.5px; color:#6A6A6A; margin-bottom:5px;\">Risk category (7-category universe)<\u002Fdiv>\n                        <sc-raw-select value=\"{{ wizCatSel }}\" sc-camel-on-change=\"{{ onCat }}\" style=\"width:100%; font-size:13px; padding:10px 12px; border:1px solid #E0E0E0; background:#FFFFFF; font-family:inherit;\">\n                          <sc-for list=\"{{ catOptions2 }}\" as=\"c\" hint-placeholder-count=\"7\"><option value=\"{{ c }}\">{{ c }}<\u002Foption><\u002Fsc-for>\n                        <\u002Fsc-raw-select>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                    <div style=\"margin-top:18px; padding:14px 16px; background:#F7F7F7; border-left:3px solid #9C2AA0; font-size:13px; line-height:1.7; color:#25282B;\">{{ wizStatement }}<\u002Fdiv>\n                  <\u002Fdiv>\n                  <div>\n                    <div style=\"font-size:10px; letter-spacing:0.16em; color:#8A8A8A; margin-bottom:14px;\">LIVE DUPLICATE DETECTION<\u002Fdiv>\n                    <sc-if value=\"{ AL ASSESSMENT<\u002Fdiv>\n                    <div style=\"display:flex; gap:7px; flex-wrap:wrap;\">\n                      <sc-for list=\"{{ wizResidualOptions }}\" as=\"o\" hint-placeholder-count=\"8\">\n                        <div sc-camel-on-click=\"{{ o.go }}\" style=\"{{ o.style }}\">{{ o.label }}<\u002Fdiv>\n                      <\u002Fsc-for>\n                    <\u002Fdiv>\n                    <div style=\"margin-top:20px;\"><span style=\"{{ wizResidualStyle }}\">{{ wizResidualBand }} {{ wizChosen }}<\u002Fspan><\u002Fdiv>\n                    <sc-if value=\"{{ wizOverrideNeeded }}\" hint-placeholder-val=\"{{ false }}\">\n                      <div style=\"margin-top:18px;\">\n                        <div style=\"padding:12px 14px; background:#FCF7E6; border-left:3px solid #EB9700; font-size:12px; color:#4A4D4E; line-height:1.6;\">You are overriding the system recommendation of {{ wizRec }}. A rationale is mandatory and will be stored with the assessment.<\u002Fdiv>\n                        <input value=\"{{ wizRationale }}\" sc-camel-on-change=\"{{ onRationale }}\" placeholder=\"Override rationale (mandatory)\" style=\"width:100%; margin-top:10px; font-size:12.5px; padding:10px 12px; border:1px solid #EB9700; font-family:inherit; outline:none;\">\n                      <\u002Fdiv>\n                    <\u002Fsc-if>\n                  <\u002Fdiv>\n                  <div>\n                    <div style=\"font-size:10px; letter-spacing:0.16em; color:#8A8A8A; margin-bottom:14px;\">SYSTEM RECOMMENDATION<\u002Fdiv>\n                    <div style=\"font-size:52px; font-weight:200; line-height:1; color:#8A8A8A;\">{{ wizRec }}<\u002Fdiv>\n                    <div style=\"font-size:12px; color:#6A6A6A; margin-top:16px; line-height:1.8;\">MVP default is a manual residual assessment supported by the system recommendation (FR-RSK-013). The recommendation, your value and the rationale are all retained.<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u0  <div style=\"font-size:12px; color:#6A6A6A; line-height:1.7;\">Linking an indicator lets the platform detect movement in exposure between scheduled reviews and trigger an event-based reassessment.<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n\n              <sc-if value=\"{{ w6 }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:24px;\">\n                  <div>\n                    <div style=\"font-size:10px; letter-spacing:0.16em; color:#8A8A8A; margin-bottom:14px;\">SUMMARY<\u002Fdiv>\n                    <sc-for list=\"{{ wizSummary }}\" as=\"s\" hint-placeholder-count=\"7\">\n                      <div style=\"display:grid; grid-template-columns:170px minmax(0,1fr); gap:16px; padding:11px 0; border-bottom:1px solid #F2F2F2; font-size:12.5px;\">\n                        <div style=\"color:#8A8A8A;\">{{ s.k }}<\u002Fdiv>\n                        <div style=\"color:#25282B; line-height:1.6;\">{{ s.v }}<\u002Fdiv>\n                      <\u002Fdiv>\n                    <\u002Fsc-for>\n                  <\u002Fdiv>\n                  <div>\n                    <div style=\"font-size:10px; letter-spacing:0.16em; color:#8A8A8A; margin-bottom:14px;\">APPROVAL ROUTING PREVIEW<\u002Fdiv>\n                    <sc-for list=\"{{ wizRouting }}\" as=\"r\" hint-placeholder-count=\"3\">\n                      <div style=\"display:flex; gap:12px; padding:12px 0; border-bottom:1px solid #F2F2F2;\">\n                        <div style=\"width:8px; height:8px; background:#E60000; margin-top:5px; flex:0 0 auto;\"><\u002Fdiv>\n                        <div>\n                          <div style=\"font-size:12.5px; color:#25282B;\">{{ r.who }}<\u002Fdiv>\n                          <div style=\"font-size:11px; color:#6A6A6A; margin-top:3px;\">{{ r.role }} · {{ r.when }}<\u002Fdiv>\n                        < turn Object.assign({}, graphVals, facVals, draftVals, mobVals, watchVals, emVals);\n  }\n\n  renderVals() {\n    const st = this.state, d = this.d, rd = this.roleDef();\n    const page = this.pageDef();\n    const built = ['workspace', 'profile', 'heatmap', 'risks', 'watchlist', 'emerging', 'riskdetail', 'los', 'wizard', 'approvals', 'controls', 'testing', 'deficiencies',\n      'kris', 'observations', 'breaches', 'actions', 'issues', 'appetite', 'trend',\n      'nbrm', 'nbrmportfolio', 'assurance', 'reports', 'pack', 'universe', 'libraries',\n      'admin', 'audit', 'brief', 'canvas', 'ai', 'graph', 'factors', 'mobile', 'create', 'objdetail', 'deepdives', 'calendar', 'meeting', 'decisions', 'scenarios', 'aggregation', 'incidents'];\n\n    const navGroups = this.navDef().map(g => ({\n      label: st.navOpen ? g.label : '',\n      items: g.items.map(it => ({\n        id: it[0], label: st.navOpen ? it[1] : '', icon: it[2], badge: '',\n        go: this.go(it[0]),\n        style: {\n          display: 'flex', alignItems: 'center', gap: '11px', padding: '8px 18px', cursor: 'pointer',\n          fontSize: '12.5px', lineHeight: 1.3,\n          color: st.route === it[0] ? '#E60000' : '#4A4D4E',\n          background: st.route === it[0] ? '#FCF2F2' : 'transparent',\n          boxShadow: st.route === it[0] ? 'inset 3px 0 0 #E60000' : 'none'\n        }\n      }))\n    }));\n\n    // search\n    const ql = st.q.trim().toLowerCase();\n    let searchResults = [];\n    if (ql.length > 1) {\n      const add = (arr, kind, route, titleKey) => arr.filter(x => (x.id + ' ' + (x[titleKey] || '')).toLowerCase().indexOf(ql) >= 0)\n        .slice(0, 4).map(x => ({ kind, id: x.id, title: x[titleKey], go: this.go(route) }));\n      searchResults = [].concat(\n        add(d.risks, 'RISK', 'risks', 'title'),\n        add(d.controls, 'CONTROL', 'controls', 'title'),\n        add(d.kris, 'KRI', 'kris', 'name'),\n        add(d.actions, 'ACTION', 'actions', 'title'),\n        add(d.nbrm, 'NBRM', 'n
